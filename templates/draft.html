<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynasty Draft Board</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
    <div class="container-fluid mt-4">
        <h2>Live Draft Board</h2>
        <div class="row mt-3">
            <!-- Available Players Column -->
            <div class="col-md-7">
                <div class="card bg-secondary text-light p-3">
                    <h4>Available Players</h4>
                    <input type="text" id="playerSearch" class="form-control mb-3" placeholder="Search player name, position...">
                    <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                        <table class="table table-dark table-striped table-sm" id="playerTable">
                            <thead>
                                <tr>
                                    <th>Player</th>
                                    <th>Pos</th>
                                    <th>Team</th>
                                    <th>Value</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="playerTableBody">
                                <!-- Populated dynamically via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Draft Picks / Roster Grid Column -->
            <div class="col-md-5">
                <div class="card bg-secondary text-light p-3">
                    <h4>Draft Tracker</h4>
                    <div id="draftLog" class="p-2 bg-dark rounded" style="height: 600px; overflow-y: auto;">
                        <p class="text-muted">Draft has not started...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Basic filter placeholder for searching players
        document.getElementById('playerSearch').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            // Add filtering logic against your player dataset here
        });
    </script>
</body>
</html>
