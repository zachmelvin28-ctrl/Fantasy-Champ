<!DOCTYPE html>
<html lang="en" data-theme="{{ current_theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynasty Trade Calculator</title>
    <style>
        /* Theme Color Variables */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary-color: #007bff;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary-color: #bb86fc;
        }
        [data-theme="auburn"] {
            --bg-color: #f8f9fa;
            --text-color: #0c2340;
            --card-bg: #ffffff;
            --primary-color: #e87722;
        }

        /* --- AFC EAST --- */
        [data-theme="bills"] { --bg-color: #081F2C; --text-color: #FFFFFF; --card-bg: #00338D; --primary-color: #C8102E; }
        [data-theme="dolphins"] { --bg-color: #002244; --text-color: #FFFFFF; --card-bg: #005F61; --primary-color: #FF642A; }
        [data-theme="patriots"] { --bg-color: #0C2340; --text-color: #FFFFFF; --card-bg: #112E4D; --primary-color: #C8102E; }
        [data-theme="jets"] { --bg-color: #0A1C16; --text-color: #FFFFFF; --card-bg: #003F2D; --primary-color: #125740; }

        /* --- AFC NORTH --- */
        [data-theme="ravens"] { --bg-color: #110B29; --text-color: #FFFFFF; --card-bg: #241773; --primary-color: #9E7C0C; }
        [data-theme="bengals"] { --bg-color: #141414; --text-color: #FFFFFF; --card-bg: #1E1E1E; --primary-color: #FB4F14; }
        [data-theme="browns"] { --bg-color: #1F140A; --text-color: #FFFFFF; --card-bg: #311D00; --primary-color: #FF3C00; }
        [data-theme="steelers"] { --bg-color: #141414; --text-color: #FFFFFF; --card-bg: #1E1E1E; --primary-color: #FFB612; }

        /* --- AFC SOUTH --- */
        [data-theme="texans"] { --bg-color: #020C11; --text-color: #FFFFFF; --card-bg: #03202F; --primary-color: #A71930; }
        [data-theme="colts"] { --bg-color: #0A192F; --text-color: #FFFFFF; --card-bg: #002C5F; --primary-color: #A5ACAF; }
        [data-theme="jaguars"] { --bg-color: #0A1619; --text-color: #FFFFFF; --card-bg: #006778; --primary-color: #9F792C; }
        [data-theme="titans"] { --bg-color: #071221; --text-color: #FFFFFF; --card-bg: #0C2340; --primary-color: #4B92DB; }

        /* --- AFC WEST --- */
        [data-theme="broncos"] { --bg-color: #0A1422; --text-color: #FFFFFF; --card-bg: #002244; --primary-color: #FB4F14; }
        [data-theme="chiefs"] { --bg-color: #1C0A0E; --text-color: #FFFFFF; --card-bg: #E31837; --primary-color: #FFB612; }
        [data-theme="raiders"] { --bg-color: #111111; --text-color: #FFFFFF; --card-bg: #1A1A1A; --primary-color: #A5ACAF; }
        [data-theme="chargers"] { --bg-color: #0A1A2F; --text-color: #FFFFFF; --card-bg: #002244; --primary-color: #0080C6; }

        /* --- NFC EAST --- */
        [data-theme="cowboys"] { --bg-color: #041022; --text-color: #FFFFFF; --card-bg: #041E42; --primary-color: #869397; }
        [data-theme="giants"] { --bg-color: #061130; --text-color: #FFFFFF; --card-bg: #0B2265; --primary-color: #A71930; }
        [data-theme="eagles"] { --bg-color: #031517; --text-color: #FFFFFF; --card-bg: #004C54; --primary-color: #A5ACAF; }
        [data-theme="commanders"] { --bg-color: #1F0A0A; --text-color: #FFFFFF; --card-bg: #5A1414; --primary-color: #FFB612; }

        /* --- NFC NORTH --- */
        [data-theme="bears"] { --bg-color: #050B14; --text-color: #FFFFFF; --card-bg: #0B162A; --primary-color: #C83803; }
        [data-theme="lions"] { --bg-color: #001A29; --text-color: #FFFFFF; --card-bg: #0076B6; --primary-color: #B0B7BC; }
        [data-theme="packers"] { --bg-color: #101C18; --text-color: #FFFFFF; --card-bg: #203731; --primary-color: #FFB612; }
        [data-theme="vikings"] { --bg-color: #1E0F33; --text-color: #FFFFFF; --card-bg: #4F2683; --primary-color: #FFC62F; }

        /* --- NFC SOUTH --- */
        [data-theme="falcons"] { --bg-color: #141414; --text-color: #FFFFFF; --card-bg: #A71930; --primary-color: #A5ACAF; }
        [data-theme="panthers"] { --bg-color: #08111A; --text-color: #FFFFFF; --card-bg: #101820; --primary-color: #0085CA; }
        [data-theme="saints"] { --bg-color: #111111; --text-color: #FFFFFF; --card-bg: #1E1E1E; --primary-color: #D3BC8D; }
        [data-theme="buccaneers"] { --bg-color: #1A0D0E; --text-color: #FFFFFF; --card-bg: #A71930; --primary-color: #FF7900; }

        /* --- NFC WEST --- */
        [data-theme="cardinals"] { --bg-color: #1A0A0F; --text-color: #FFFFFF; --card-bg: #97233F; --primary-color: #000000; }
        [data-theme="rams"] { --bg-color: #001838; --text-color: #FFFFFF; --card-bg: #003594; --primary-color: #FFD100; }
        [data-theme="49ers"] { --bg-color: #220000; --text-color: #FFFFFF; --card-bg: #AA0000; --primary-color: #B3995D; }
        [data-theme="seahawks"] { --bg-color: #001122; --text-color: #FFFFFF; --card-bg: #002244; --primary-color: #69BE28; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }
        button.theme-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>Dynasty Trade Calculator</h1>
            
            <!-- Theme Selector Form -->
            <form method="POST">
                <select name="theme" id="theme" onchange="this.form.submit()">
                    {% for key, theme in themes.items() %}
                    <option value="{{ key }}" {% if key == current_theme %}selected{% endif %}>
                        {{ theme.name }}
                    </option>
                    {% endfor %}
                </select>
            </form>
        </div>

        <p>Sleeper league integration active. Select a theme above to instantly update your view.</p>
        
        <!-- Add your trade calculator UI elements below -->
    </div>
</body>
</html>
